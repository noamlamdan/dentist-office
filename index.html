<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EC45">
<title>ביקור במרפאת השיניים | Zizzle Inventions</title>
<meta name="description" content="סרטון קצר שמכיר לילדים את מרפאת השיניים: הכיסא, המנורה, צילום הרנטגן והכלים.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zizzle Inventions">
<meta property="og:title" content="ביקור במרפאת השיניים">
<meta property="og:description" content="סרטון קצר שמכיר לילדים את מרפאת השיניים: הכיסא, המנורה, צילום הרנטגן והכלים.">
<meta property="og:image" content="https://noamlamdan.github.io/dentist-office/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="art/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root { --yellow: #F7EC45; --plum: #432945; --pink: #F285B5; --white: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--yellow); color: var(--plum); font-family: 'Varela Round', ui-rounded, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100dvh; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: flex-end; gap: 12px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .lang { display: flex; flex: none; padding: 4px; border-radius: 999px; background: var(--white); direction: ltr; }
  .lang button { min-width: 84px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: none; color: var(--plum); font: inherit; font-size: 17px; cursor: pointer; transition: background .2s, transform .12s; }
  .lang button:active { transform: scale(.94); }
  .lang button[aria-pressed=true] { background: var(--pink); color: var(--plum); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; margin-inline: -16px; min-height: 0; padding: 10px 0; }
  .stage { position: relative; width: min(100%, calc((100dvh - 110px) * 2.2227)); aspect-ratio: 2276 / 1024; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--yellow); }
  #hit { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: none; cursor: default; touch-action: manipulation; }
  /* the place to press: big and forgiving, with a ripple so the waiting picture stays alive */
  #spot { position: absolute; width: 19%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; touch-action: manipulation; }
  #spot[hidden] { display: none; }
  #spot::before, #spot::after { content: ''; position: absolute; inset: 22%; border: 4px solid var(--white); border-radius: 50%; opacity: 0; }
  #spot.waiting::before { animation: ripple 1.1s ease-out infinite; }
  #spot.waiting::after { animation: ripple 1.1s ease-out .55s infinite; }
  #spot.nudge { animation: nudge .32s ease-out; }
  #spot.pop::before { animation: pop .22s ease-out; }
  @keyframes ripple { from { transform: scale(.55); opacity: .95; } to { transform: scale(1.3); opacity: 0; } }
  @keyframes pop { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes nudge { 30% { transform: translate(-50%, -50%) scale(1.22); } 65% { transform: translate(-50%, -50%) scale(.94); } }
  #play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; border: 0; background: none; cursor: pointer; padding: 0; }
  #play i { display: grid; place-items: center; width: clamp(72px, 13vw, 118px); aspect-ratio: 1; border-radius: 50%; background: var(--white); box-shadow: 0 6px 0 rgba(67, 41, 69, .16); transition: transform .14s; }
  #play:hover i { transform: scale(1.06); }
  #play:active i { transform: scale(.94); }
  #play svg { width: 44%; margin-inline-start: 6%; direction: ltr; }
  #play[hidden] { display: none; }
  footer { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  footer img { height: 24px; display: block; }
  @media (max-height: 520px) {
    body { padding: 6px 10px; }
    main { margin-inline: -10px; }
    footer { display: none; }
    header { position: fixed; top: 6px; inset-inline-end: 10px; width: auto; z-index: 2; transition: opacity .25s; }
    body.playing header { opacity: 0; pointer-events: none; }
    .lang button { min-height: 38px; min-width: 72px; }
    .stage { width: min(100%, calc((100dvh - 12px) * 2.2227)); }
    main { padding: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="lang" role="group" aria-label="Language / שפה">
    <button type="button" data-lang="he" lang="he" aria-pressed="true">עברית</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
  </div>
</header>
<main>
  <div class="stage">
    <video id="movie" poster="media/poster.jpg" playsinline preload="metadata" disablepictureinpicture></video>
    <button id="hit" type="button" tabindex="-1" aria-hidden="true"></button>
    <button id="spot" type="button" aria-label="OK" hidden></button>
    <button id="play" type="button" aria-label="הפעלה"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1.2 1.2 0 0 0 1.8 1l14-8.5a1.2 1.2 0 0 0 0-2L7.8 2.5a1.2 1.2 0 0 0-1.8 1Z" fill="#F285B5"/></svg></i></button>
  </div>
</main>
<footer>
  <img src="art/zizzlelab.png" alt="Zizzlelab">
  <span id="legal">© 2026 Zizzlelab. כל הזכויות שמורות.</span>
</footer>
<script>
  // Each language's line starts, so the toggle lands on the same moment of the story.
  var CUES = {"en": [0.8, 7.7, 12.24, 15.42, 19.0, 22.2, 25.64, 29.32, 33.2, 35.66, 38.86, 43.3, 48.08, 51.9, 55.78, 57.46, 60.56, 64.5, 67.54, 72.06, 75.14, 80.0, 83.16, 88.36, 92.12, 98.04, 104.66, 108.46, 111.06, 114.38, 117.18, 120.68], "he": [0.8, 8.19, 13.97, 17.09, 21.06, 23.93, 27.77, 31.63, 35.81, 38.5, 42.05, 47.39, 52.07, 56.47, 60.76, 62.34, 65.85, 70.06, 73.16, 76.95, 80.28, 84.64, 88.3, 93.34, 97.31, 102.52, 109.37, 113.85, 116.49, 120.0, 122.8, 126.7]};
  // Where the movie stops until the child presses the white circle.
  var GATES = {"en": [{"id": "door", "on": 4.0, "stop": 6.35, "x": 0.5712, "y": 0.6465}, {"id": "chair_p", "on": 16.7, "stop": 18.94, "x": 0.5668, "y": 0.668}, {"id": "back_p", "on": 23.14, "stop": 24.42, "x": 0.3792, "y": 0.2077}, {"id": "bib_p", "on": 30.7, "stop": 31.98, "x": 0.6591, "y": 0.3555}, {"id": "light_p", "on": 36.56, "stop": 38.61, "x": 0.3735, "y": 0.1484}, {"id": "xray_p", "on": 49.6, "stop": 51.54, "x": 0.4376, "y": 0.1343}, {"id": "mirror_p", "on": 58.46, "stop": 60.41, "x": 0.645, "y": 0.4082}, {"id": "squirt_p", "on": 65.44, "stop": 67.39, "x": 0.6889, "y": 0.3691}, {"id": "straw_p", "on": 73.04, "stop": 74.99, "x": 0.7258, "y": 0.3691}, {"id": "brush_p", "on": 81.06, "stop": 83.01, "x": 0.7627, "y": 0.3691}, {"id": "cup_p", "on": 89.62, "stop": 90.9, "x": 0.6986, "y": 0.5859}, {"id": "hand_p", "on": 106.16, "stop": 107.71, "x": 0.445, "y": 0.5251}, {"id": "stick_p", "on": 118.18, "stop": 119.46, "x": 0.4921, "y": 0.3359}], "he": [{"id": "door", "on": 4.49, "stop": 6.84, "x": 0.5712, "y": 0.6465}, {"id": "chair_p", "on": 18.76, "stop": 21.0, "x": 0.5668, "y": 0.668}, {"id": "back_p", "on": 25.27, "stop": 26.55, "x": 0.3792, "y": 0.2077}, {"id": "bib_p", "on": 33.31, "stop": 34.59, "x": 0.6591, "y": 0.3555}, {"id": "light_p", "on": 39.75, "stop": 41.8, "x": 0.3735, "y": 0.1484}, {"id": "xray_p", "on": 54.17, "stop": 56.11, "x": 0.4376, "y": 0.1343}, {"id": "mirror_p", "on": 63.75, "stop": 65.7, "x": 0.645, "y": 0.4082}, {"id": "squirt_p", "on": 71.06, "stop": 73.01, "x": 0.6889, "y": 0.3691}, {"id": "straw_p", "on": 78.18, "stop": 80.13, "x": 0.7258, "y": 0.3691}, {"id": "brush_p", "on": 86.2, "stop": 88.15, "x": 0.7627, "y": 0.3691}, {"id": "cup_p", "on": 94.81, "stop": 96.09, "x": 0.6986, "y": 0.5859}, {"id": "hand_p", "on": 111.55, "stop": 113.1, "x": 0.445, "y": 0.5251}, {"id": "stick_p", "on": 124.2, "stop": 125.48, "x": 0.4921, "y": 0.3359}]};
  var WORDS = {
    he: { dir: 'rtl', page: 'ביקור במרפאת השיניים | Zizzle Inventions', legal: '© 2026 Zizzlelab. כל הזכויות שמורות.', play: 'הפעלה' },
    en: { dir: 'ltr', page: 'A visit to the dentist | Zizzle Inventions', legal: '© 2026 Zizzlelab. All rights reserved.', play: 'Play' }
  };
  var movie = document.getElementById('movie'), play = document.getElementById('play');
  var buttons = document.querySelectorAll('.lang button');
  var hit = document.getElementById('hit'), spot = document.getElementById('spot');
  var lang = null, waiting = null, passed = {};

  function saved() {
    try { return localStorage.getItem('dentist-lang'); } catch (e) { return null; }
  }
  function remember(l) {
    try { localStorage.setItem('dentist-lang', l); } catch (e) {}
  }
  function firstLang() {
    var asked = new URLSearchParams(location.search).get('lang');
    if (WORDS[asked]) return asked;
    if (WORDS[saved()]) return saved();
    return /^(he|iw)\b/i.test(navigator.language || '') ? 'he' : 'en';
  }
  // the same point of the same line, in the other language
  function sameMoment(t, from, to) {
    var a = CUES[from], b = CUES[to], i = a.length - 1;
    while (i > 0 && a[i] > t) i--;
    if (i === a.length - 1) return b[i] + Math.max(0, t - a[i]);
    return b[i] + (t - a[i]) / (a[i + 1] - a[i]) * (b[i + 1] - b[i]);
  }
  function setLang(l, keep) {
    if (l === lang) return;
    var from = lang, t = movie.currentTime, going = !movie.paused;
    lang = l;
    var w = WORDS[l];
    document.documentElement.lang = l;
    document.documentElement.dir = w.dir;
    document.title = w.page;
    document.getElementById('legal').textContent = w.legal;
    play.setAttribute('aria-label', w.play);
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    movie.src = 'media/' + l + '.mp4';
    if (keep && from && t > 0) {
      movie.addEventListener('loadedmetadata', function () {
        var g = waiting && gate(waiting.id);
        passed = {};
        var to = g ? g.stop : sameMoment(t, from, l);
        GATES[l].forEach(function (x) { if (x.stop < to && !(g && x.id === g.id)) passed[x.id] = true; });
        movie.currentTime = to;
        if (g) wait(g); else if (going) movie.play();
      }, { once: true });
    }
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang, true); remember(lang); });
  });
  function gate(id) { return GATES[lang].filter(function (g) { return g.id === id; })[0]; }
  function showSpot(g) {
    spot.style.left = g.x * 100 + '%';
    spot.style.top = g.y * 100 + '%';
    spot.hidden = false;
  }
  function wait(g) {
    waiting = g;
    movie.pause();
    showSpot(g);
    spot.classList.add('waiting');
    play.hidden = true;
  }
  // the press: answer at once, then the movie carries on from the moment before the action
  function pressed() {
    var g = waiting || live;
    if (!g) return;
    passed[g.id] = true;
    spot.classList.remove('waiting', 'pop');
    void spot.offsetWidth;
    spot.classList.add('pop');
    if (waiting) waiting = null;
    else movie.currentTime = g.stop;
    live = null;
    movie.play();
    setTimeout(function () { if (!waiting && !live) spot.hidden = true; }, 240);
  }
  var live = null;                                   // a gate whose circle is up while the movie runs on to its stop
  function watch() {
    var t = movie.currentTime;
    if (!movie.paused && !waiting) {
      GATES[lang].some(function (g) {
        if (passed[g.id]) return false;
        if (t >= g.stop - 0.02) { live = null; wait(g); return true; }
        if (t >= g.on && live !== g) { live = g; showSpot(g); }
        return t < g.stop;
      });
    }
    requestAnimationFrame(watch);
  }
  requestAnimationFrame(watch);
  spot.addEventListener('pointerdown', function (e) { e.preventDefault(); pressed(); });
  spot.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') pressed(); });
  // a press anywhere else: the circle bounces while waiting; otherwise it pauses or carries on
  hit.addEventListener('pointerdown', function () {
    if (waiting) {
      spot.classList.remove('nudge');
      void spot.offsetWidth;
      spot.classList.add('nudge');
    } else if (!movie.paused) {
      movie.pause();
      play.hidden = false;
    }
  });
  play.addEventListener('click', function () { play.hidden = true; movie.play(); });
  movie.addEventListener('play', function () { play.hidden = true; document.body.classList.add('playing'); });
  movie.addEventListener('pause', function () { if (!waiting) document.body.classList.remove('playing'); });
  movie.addEventListener('ended', function () {
    play.hidden = false; passed = {}; waiting = null; live = null; spot.hidden = true;
    document.body.classList.remove('playing');
    movie.currentTime = 0;
  });
  setLang(firstLang(), false);
</script>
</body>
</html>
